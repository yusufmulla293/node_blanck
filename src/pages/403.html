<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>403 - Access Denied</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fa;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
      }

      .container {
        width: 90%;
        max-width: 500px;
        text-align: center;
        background: #ffffff;
        padding: 50px 35px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      .error-code {
        font-size: 90px;
        font-weight: 700;
        color: #dc3545;
        line-height: 1;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 15px;
        color: #222;
      }

      p {
        font-size: 16px;
        line-height: 1.6;
        color: #666;
        margin-bottom: 25px;
      }

      .footer {
        margin-top: 25px;
        font-size: 13px;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="error-code">403</div>
      <h1>Access Denied</h1>
      <p>You do not have permission to access this resource.</p>
      <div class="footer">HTTP 403 - Forbidden</div>
    </div>
  </body>
</html>
